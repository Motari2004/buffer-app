<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buffer Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="dashboard-layout">

  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">🟦 Buffer Dashboard</span>
    </div>
    <div class="topbar-right">
      <a href="/auth/buffer" class="btn btn-primary btn-sm">+ Connect Account</a>
      <a href="/logout" class="btn btn-outline btn-sm">Disconnect All</a>
    </div>
  </header>

  <main class="main-content">
    <div class="page-header">
      <h1>Your Accounts</h1>
      <p class="subtitle" id="subtitle">Loading...</p>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <span class="kpi-label">Connected Accounts</span>
        <span class="kpi-value" id="kpiAccounts">—</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">Total Channels</span>
        <span class="kpi-value" id="kpiChannels">—</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">Posts in Queue</span>
        <span class="kpi-value" id="kpiPosts">—</span>
      </div>
    </div>

    <div id="accountsContainer"></div>
  </main>

  <!-- __INITIAL_DATA__ -->

  <script>
    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      })[c]);
    }

    (function hydrate() {
      const data = window.__INITIAL_DATA__;
      if (!data) return;

      document.getElementById("subtitle").textContent =
        `${data.accountCount} account(s) connected · ${data.totalPosts} posts`;

      document.getElementById("kpiAccounts").textContent = data.accountCount;
      document.getElementById("kpiChannels").textContent = data.totalChannels;
      document.getElementById("kpiPosts").textContent = data.totalPosts;

      const container = document.getElementById("accountsContainer");

      container.innerHTML = data.accounts.map(acct => {
        if (acct.error) {
          return `
            <div class="card account-card">
              <div class="card-header">
                <h3>${escapeHtml(acct.email)}</h3>
                <button onclick="disconnect('${escapeHtml(acct.bufferUserId)}')" class="btn btn-outline btn-sm">Remove</button>
              </div>
              <p style="color:#ef4444">Error: ${escapeHtml(acct.error)}</p>
            </div>
          `;
        }

        const channelsHtml = acct.channels.map(c => `
          <span class="tag ${escapeHtml((c.service||"").toLowerCase())}">
            ${escapeHtml(c.service)}: ${escapeHtml(c.name || c.displayName || "Untitled")}
            ${c.isDisconnected ? '<em style="color:#ef4444">(disconnected)</em>' : ''}
          </span>
        `).join(" ") || '<em style="color:#7a8092">No channels</em>';

        const postsHtml = acct.posts.slice(0, 5).map(p => `
          <tr>
            <td>${escapeHtml(p.text?.slice(0, 50) || "(no text)")}</td>
            <td><span class="status ${p.status === 'sent' ? 'sent' : 'scheduled'}">${escapeHtml(p.status)}</span></td>
            <td>${p.dueAt ? new Date(p.dueAt).toLocaleDateString() : '—'}</td>
          </tr>
        `).join("") || '<tr><td colspan="3" style="text-align:center;color:#7a8092">No posts</td></tr>';

        return `
          <div class="card account-card" style="margin-bottom:1.5rem">
            <div class="card-header">
              <h3>${escapeHtml(acct.name || acct.email)}</h3>
              <button onclick="disconnect('${escapeHtml(acct.bufferUserId)}')" class="btn btn-outline btn-sm">Remove</button>
            </div>
            <p style="color:#7a8092;font-size:0.85rem">${escapeHtml(acct.email)} · Org: ${escapeHtml(acct.organization?.name || "—")}</p>

            <h4 style="margin:1rem 0 0.5rem;font-size:0.85rem;text-transform:uppercase;color:#7a8092">Channels</h4>
            <div style="display:flex;flex-wrap:wrap;gap:0.5rem">${channelsHtml}</div>

            <h4 style="margin:1rem 0 0.5rem;font-size:0.85rem;text-transform:uppercase;color:#7a8092">Recent Posts</h4>
            <table class="data-table">
              <thead><tr><th>Content</th><th>Status</th><th>Due</th></tr></thead>
              <tbody>${postsHtml}</tbody>
            </table>
          </div>
        `;
      }).join("");
    })();

    async function disconnect(id) {
      if (!confirm("Remove this account?")) return;
      await fetch(`/disconnect/${encodeURIComponent(id)}`, { method: "POST" });
      window.location.reload();
    }
  </script>
</body>
</html>
